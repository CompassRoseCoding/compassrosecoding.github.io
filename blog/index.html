<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Compass Rose Coding | Blog</title>
    <link rel="icon" href="../resources/images/compass_icon.png">

    <link href="../resources/header_style.css" rel="stylesheet" type="text/css" />
    <script src="../resources/header_script.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VKT25Q38Q1"></script>

    <link href="blog_style.css" rel="stylesheet" type="text/css" />
    <link href="post_style.css" rel="stylesheet" type="text/css" />

    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">

    <script src="loadBlog.js"></script>
    <script src="changeBlog.js"></script>
    <script src="filterBlog.js"></script>

    <script src="https://www.google.com/recaptcha/api.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Include your favorite highlight.js stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
        rel="stylesheet">

    <!-- Include the highlight.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body onload="blogInit()">
    <!-- general header for all pages with animated compass -->
    <div class="header" id="header">
        <div class="mobile_menu">
            <button class="menu_btn header_text_size" onclick="dropDown()">Menu </button>
            <button class="menu_span menu_btn header_text_size" id="menu_span" onclick="dropDown()">⫸</button>
        </div>
        <div class="tabs_div" id="tabs_div">
            <a class="current page_btn header_text_size" href="../home">Home</a>
            <a class="current page_btn header_text_size" href="../resume">Resume</a>
            <a class="current page_btn header_text_size" href="../design">Design</a>
            <a class="current page_btn header_text_size" href="../games">Games</a>
            <a class="current page_btn header_text_size" href="../blog">Blog</a>
        </div>
        <div class="header_top header_height">
            <div class="header_underlay header_height">
            </div>
            <div class="header_overlay header_height">
                <div class="compass_div header_height">
                    <h1 class="header_text">Compass Rose Coding</h1>
                    <canvas class="header_canvas" id="header_canvas" height="500" width="500"></canvas>
                    <h1 class="page_header header_text_size">Blog</h1>
                </div>
            </div>
        </div>
    </div>

    <div class="search_div">
        <input class="search_bar" id="search_bar" type="search" placeholder="Search..">
    </div>

    <div class="selected_tags_div" id="selected_tags_div"></div>

    <div class="window_content">
        <div class="blog_content" id="blog_content"></div>
        <div class="tags_content" id="tags_content"></div>
    </div>

    <div class="footer_div">
        <div class="page_select_div">
            <button onclick="prevPage()" class="arrow_btn">⮘</button>
            <select id="pageSelect" onchange="filterBlog()" class="round_select">
                <option value=1 id="pg1">1</option>
            </select>
            <button onclick="nextPage()" class="arrow_btn">⮚</button>
        </div>
    
        <select id="postPerPage" onchange="filterBlog()" class="round_select">
            <option value=5 >  5 Posts Per Page</option>
            <option value=10>  10 Posts Per Page</option>
            <option value=25>  25 Posts Per Page</option>
            <option value=50>  50 Posts Per Page</option>
        </select>
    </div>
</body>

</html>
