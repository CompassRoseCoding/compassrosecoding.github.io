<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Compass Rose Coding | Blog</title>
    <link rel="icon" href="../resources/images/compass_icon.png">

    <link href="../resources/header_style.css" rel="stylesheet" type="text/css" />
    <script src="../resources/header_script.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VKT25Q38Q1"></script>

    <link href="blog_style.css" rel="stylesheet" type="text/css" />

    <script src="loadBlog.js"></script>
    <script src="changeBlog.js"></script>

    <script src="https://www.google.com/recaptcha/api.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body onload="blogInit()">
    <div class="header" id="header">
        <div class="side_by_side">
            <a class="current page_btn" href="../blog_editor">Editor</a>
            <a class="page_btn" href="../blog">Blog</a>
        </div>
    </div>

    <div class="">
        <div class="search_div right_div">
            <input class="search_bar" id="search_bar" type="text" placeholder="Search..">
            <button class="search_button">Search</button>
        </div>
        <div class="selected_tags_div center_div" id="selected_tags_div"></div>
    </div>

    <div class="window_content">
        <div class="blog_content" id="blog_content"></div>
        <div class="tags_content" id="tags_content"></div>
    </div>

    <div class="center_div">
        <div class="page_select_div center_div">
            <button onclick="prevPage()" class="small_btn">⫷</button>
            <select id="pageSelect" onchange="changePage()" class="small_btn">
            </select>
            <button onclick="nextPage()" class="small_btn">⫸</button>
        </div>
    </div>

    <div class="center_div">
        <select id="postPerPage" onchange="loadPosts()" class="small_btn">
            <option value="10" id="opt1"> 10 Posts Per Page</option>
            <option value="25" id="opt1"> 25 Posts Per Page</option>
            <option value="50" id="opt1"> 50 Posts Per Page</option>
        </select>
    </div>
    </div>
</body>

</html>
